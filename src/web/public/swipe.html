<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ScholarFinder — swipe deck</title>
<style>
  :root {
    --bg: #f4f3ef; --card: #ffffff; --border: #e4e2db; --text: #1b1b19; --text-muted: #6b6a63;
    --yes: #1d9e75; --no: #d85a30; --accent: #185fa5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161614; --card: #242420; --border: #3a3a34; --text: #f1efe8; --text-muted: #a3a199; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #app { max-width: 420px; margin: 0 auto; padding: 16px 16px 32px; min-height: 100vh; }
  h1 { font-size: 16px; font-weight: 600; text-align: center; margin: 4px 0 16px; }
  #stack { position: relative; height: 520px; }
  .card { position: absolute; inset: 0; background: var(--card); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; touch-action: none; user-select: none; }
  .photo-wrap { position: relative; height: 230px; background: var(--border); flex-shrink: 0; }
  .photo-wrap canvas, .photo-wrap img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .body { padding: 14px 16px; flex: 1; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
  .name { font-size: 18px; font-weight: 600; margin: 0; }
  .sub { font-size: 13px; color: var(--text-muted); margin: 0; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 2px 0; }
  .tag { font-size: 11px; padding: 3px 9px; border-radius: 20px; background: var(--bg); color: var(--text-muted); border: 1px solid var(--border); }
  .reasons { font-size: 13px; color: var(--text); margin: 4px 0 0; }
  .elig { font-size: 13px; color: var(--accent); margin: 0; }
  .stamp { position: absolute; top: 18px; font-size: 26px; font-weight: 800; letter-spacing: 1px; padding: 4px 14px; border-radius: 8px; border: 4px solid; opacity: 0; text-transform: uppercase; }
  .stamp-yes { left: 18px; color: var(--yes); border-color: var(--yes); transform: rotate(-16deg); }
  .stamp-no { right: 18px; color: var(--no); border-color: var(--no); transform: rotate(16deg); }
  #controls { display: flex; justify-content: center; gap: 24px; margin-top: 20px; }
  .btn { width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--border); background: var(--card); display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; }
  .btn:active { transform: scale(0.94); }
  #empty, #reveal { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 14px; }
  #reveal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; padding: 24px; }
  #reveal.show { display: flex; }
  #reveal .panel { background: var(--card); border-radius: 16px; padding: 20px; max-width: 360px; white-space: pre-line; font-size: 14px; color: var(--text); text-align: left; }
  #reveal button { margin-top: 16px; width: 100%; padding: 10px; border-radius: 10px; border: none; background: var(--accent); color: #fff; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>
<div id="app">
  <h1>Swipe your matches</h1>
  <div id="stack"></div>
  <div id="controls">
    <button class="btn" id="btn-no" aria-label="No">✕</button>
    <button class="btn" id="btn-yes" aria-label="Yes">♥</button>
  </div>
</div>
<div id="reveal"><div class="panel"><div id="reveal-text"></div><button id="reveal-continue">Keep swiping</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.140.0/three.min.js"></script>
<script>
(function(){
  var studentId = "__STUDENT_ID__";
  var stack = document.getElementById("stack");
  var deck = [];
  var current = 0;
  var threeCtx = null;

  function disposeThree(){
    if(!threeCtx) return;
    threeCtx.renderer.dispose();
    threeCtx.geometry.dispose();
    threeCtx.material.dispose();
    if(threeCtx.texture) threeCtx.texture.dispose();
    threeCtx = null;
  }

  function mountPhoto(canvas, photoUrl){
    disposeThree();
    var w = canvas.clientWidth, h = canvas.clientHeight;
    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    renderer.setSize(w, h, false);
    var scene = new THREE.Scene();
    var camera = new THREE.OrthographicCamera(-w/2, w/2, h/2, -h/2, 0.1, 10);
    camera.position.z = 2;
    var geometry = new THREE.PlaneGeometry(w, h);
    var material = new THREE.MeshBasicMaterial({ color: 0x888880 });
    var mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);
    var texture = null;
    if(photoUrl){
      texture = new THREE.TextureLoader().load(photoUrl, function(){ renderer.render(scene, camera); });
      texture.colorSpace = THREE.SRGBColorSpace || texture.colorSpace;
      material.map = texture;
      material.color.set(0xffffff);
      material.needsUpdate = true;
    }
    threeCtx = { renderer: renderer, scene: scene, camera: camera, mesh: mesh, geometry: geometry, material: material, texture: texture };
    renderer.render(scene, camera);
    return threeCtx;
  }

  function setTilt(dx){
    if(!threeCtx) return;
    threeCtx.mesh.rotation.y = Math.max(-0.5, Math.min(0.5, dx / 300));
    threeCtx.renderer.render(threeCtx.scene, threeCtx.camera);
  }

  function cardHtml(item){
    var tags = (item.cultureTags||[]).map(function(t){ return '<span class="tag">'+t+'</span>'; }).join("");
    var subParts = [];
    if(item.worldRanking) subParts.push("#"+item.worldRanking+" world");
    if(item.city) subParts.push(item.city + (item.state ? ", "+item.state : ""));
    return '<div class="card">' +
      '<div class="photo-wrap"><canvas class="photo-canvas"></canvas></div>' +
      '<div class="body">' +
        '<p class="name">'+item.name+'</p>' +
        '<p class="sub">'+subParts.join(" · ")+'</p>' +
        '<div class="tags">'+tags+'</div>' +
        (item.matchReasons && item.matchReasons.length ? '<p class="reasons">'+item.matchReasons.join(", ")+'</p>' : '') +
        (item.eligibility ? '<p class="elig">'+item.eligibility+'</p>' : '') +
      '</div>' +
      '<div class="stamp stamp-yes">yes</div>' +
      '<div class="stamp stamp-no">no</div>' +
    '</div>';
  }

  function render(){
    disposeThree();
    if(current >= deck.length){
      stack.innerHTML = '<div id="empty">That&#39;s everyone who matched.<br>Check iMessage — I&#39;ll keep you posted on deadlines and outreach.</div>';
      return;
    }
    stack.innerHTML = cardHtml(deck[current]);
    var card = stack.querySelector(".card");
    var canvas = card.querySelector(".photo-canvas");
    requestAnimationFrame(function(){ mountPhoto(canvas, deck[current].photoUrl); attachDrag(card); });
  }

  function attachDrag(card){
    var startX = 0, dx = 0, dragging = false;
    var stampYes = card.querySelector(".stamp-yes");
    var stampNo = card.querySelector(".stamp-no");

    function onMove(x){
      dx = x - startX;
      card.style.transform = "translateX("+dx+"px) rotate("+(dx/18)+"deg)";
      stampYes.style.opacity = Math.max(0, Math.min(1, dx/80));
      stampNo.style.opacity = Math.max(0, Math.min(1, -dx/80));
      setTilt(dx);
    }
    function onEnd(){
      if(!dragging) return;
      dragging = false;
      if(dx > 110) finish("yes");
      else if(dx < -110) finish("no");
      else {
        card.style.transition = "transform 0.2s";
        card.style.transform = "translateX(0) rotate(0)";
        setTimeout(function(){ card.style.transition = ""; }, 200);
      }
    }
    card.addEventListener("pointerdown", function(e){ dragging = true; startX = e.clientX; card.setPointerCapture(e.pointerId); });
    card.addEventListener("pointermove", function(e){ if(dragging) onMove(e.clientX); });
    card.addEventListener("pointerup", onEnd);
    card.addEventListener("pointercancel", onEnd);

    document.getElementById("btn-yes").onclick = function(){ finish("yes"); };
    document.getElementById("btn-no").onclick = function(){ finish("no"); };
  }

  function finish(decision){
    var card = stack.querySelector(".card");
    var flyX = decision === "yes" ? window.innerWidth : -window.innerWidth;
    if(card){
      card.style.transition = "transform 0.3s";
      card.style.transform = "translateX("+flyX+"px) rotate("+(flyX/18)+"deg)";
    }
    var universityId = deck[current].id;
    fetch("/api/swipe", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ studentId: studentId, universityId: universityId, decision: decision })
    }).then(function(r){ return r.json(); }).then(function(data){
      current++;
      if(decision === "yes" && data.card){
        document.getElementById("reveal-text").textContent = data.card;
        document.getElementById("reveal").classList.add("show");
      } else {
        setTimeout(render, 280);
      }
    }).catch(function(){ current++; setTimeout(render, 280); });
  }

  document.getElementById("reveal-continue").onclick = function(){
    document.getElementById("reveal").classList.remove("show");
    render();
  };

  fetch("/api/swipe-stack/" + studentId).then(function(r){ return r.json(); }).then(function(data){
    deck = data.cards || [];
    render();
  }).catch(function(){
    stack.innerHTML = '<div id="empty">Couldn&#39;t load your matches. Try reopening this link from iMessage.</div>';
  });
})();
</script>
</body>
</html>
